<aside
  class="sidebar"
  [class.sidebar--collapsed]="collapsed()"
  [class.sidebar--mobile-open]="mobileOpen()"
  id="primary-navigation"
  aria-label="Main navigation"
>
  <div class="sidebar__section-label">WORKSPACE</div>
  <nav class="primary-nav">
    @for (item of navigation(); track item.label) {
      <button
        class="nav-link"
        [class.nav-link--active]="activePage().label === item.label"
        [attr.aria-current]="activePage().label === item.label ? 'page' : null"
        [attr.aria-label]="item.label"
        [title]="collapsed() ? item.label : null"
        type="button"
        (click)="pageSelected.emit(item)"
      >
      <svg class="nav-link__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path [attr.d]="item.icon" />
      </svg>
      <span class="nav-link__label">{{ item.label }}</span>
      </button>
    }
  </nav>
</aside>
